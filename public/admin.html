<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dot — Annonces</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main>
    <section class="card">
      <h2>Saisir une coupure programmée</h2>
      <p class="muted">Recopier les annonces officielles (ENEO, communiqués, radio…). Chaque annonce sera ensuite comparée à la réalité : la fiabilité de la source est calculée automatiquement.</p>
      <form id="f">
        <p><label>Jeton administrateur<br><input id="token" type="password" required style="width:100%"></label></p>
        <p><label>Source<br><select id="source"><option value="eneo">ENEO</option><option value="camwater">Camwater</option><option value="autre">Autre</option></select></label></p>
        <p><label>Quartiers concernés (Ctrl/Maj pour plusieurs ; zone d'environ 1 km autour de chacun)<br><select id="zones" multiple size="10" required></select></label></p>
        <div class="row">
          <label>Début<br><input id="start" type="datetime-local" required></label>
          <label>Fin<br><input id="end" type="datetime-local" required></label>
        </div>
        <p class="muted">Heures de Douala / Yaoundé (UTC+1).</p>
        <p><label>Motif<br><input id="note" maxlength="300" style="width:100%"></label></p>
        <p><label>Lien vers l'annonce<br><input id="url" type="url" style="width:100%"></label></p>
        <button class="primary" type="submit">Enregistrer</button>
        <span id="msg" class="muted"></span>
      </form>
    </section>
    <section class="card">
      <h2>Annonces récentes et à venir</h2>
      <ul id="list" class="windows"></ul>
    </section>
  </main>
  <script type="module">
    const TZ = 3600_000;
    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
    const toUtc = (v) => Date.parse(`${v}:00Z`) - TZ; // saisie en heure locale UTC+1
    const fmt = (t) => new Date(t).toLocaleString('fr-FR', { timeZone: 'Africa/Douala', dateStyle: 'short', timeStyle: 'short' });
    try { $('token').value = sessionStorage.getItem('dot.admin') || ''; } catch {}
    const meta = await (await fetch('/api/meta')).json();
    $('zones').innerHTML = meta.cities.map((c) => `<optgroup label="${esc(c.name)}">${meta.quartiers.filter((z) => z.city === c.name).map((z) => `<option value="${z.id}">${esc(z.name)}</option>`).join('')}</optgroup>`).join('');

    async function load() {
      const list = await (await fetch('/api/planned')).json();
      $('list').innerHTML = list.length
        ? list.map((p) => `<li><b>${esc(p.sourceId.replace('official:', '').toUpperCase())}</b> ${fmt(p.start)} → ${fmt(p.end)} · ${esc(p.label)} ${p.note ? `· ${esc(p.note)}` : ''} <button data-del="${p.id}">Supprimer</button></li>`).join('')
        : '<li class="muted">Aucune annonce.</li>';
      document.querySelectorAll('[data-del]').forEach((b) => (b.onclick = async () => {
        const r = await fetch(`/api/admin/planned/${b.dataset.del}`, { method: 'DELETE', headers: { authorization: `Bearer ${$('token').value}` } });
        if (!r.ok) alert((await r.json()).error);
        load();
      }));
    }

    $('f').onsubmit = async (e) => {
      e.preventDefault();
      try { sessionStorage.setItem('dot.admin', $('token').value); } catch {}
      const body = {
        source: $('source').value,
        quartiers: [...$('zones').selectedOptions].map((o) => o.value),
        start: toUtc($('start').value),
        end: toUtc($('end').value),
        note: $('note').value || undefined,
        url: $('url').value || undefined,
      };
      const r = await fetch('/api/admin/planned', { method: 'POST', headers: { 'content-type': 'application/json', authorization: `Bearer ${$('token').value}` }, body: JSON.stringify(body) });
      const data = await r.json();
      $('msg').textContent = r.ok ? 'Enregistré.' : data.error;
      if (r.ok) load();
    };
    load();
  </script>
</body>
</html>
