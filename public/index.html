<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Dot Courant</title>
  <meta name="description" content="Savoir s'il y a le courant chez soi et anticiper les coupures.">
  <meta name="theme-color" content="#0f172a">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="top">
    <a href="#accueil" class="brand"><img src="/icon.svg" alt="" width="28" height="28"> Dot</a>
    <span id="net" class="net" hidden>Hors ligne</span>
  </header>
  <div id="demo" class="demo" hidden>Démonstration : les coupures affichées sont simulées.</div>
  <main id="view" aria-live="polite"></main>
  <button id="fab" class="fab" type="button" hidden>Signaler</button>
  <nav class="tabs" id="tabs">
    <a href="#accueil" data-tab="accueil"><span aria-hidden="true">⌂</span>Accueil</a>
    <a href="#carte" data-tab="carte"><span aria-hidden="true">◎</span>Carte</a>
    <a href="#bilan" data-tab="bilan"><span aria-hidden="true">▤</span>Bilan</a>
    <a href="#profil" data-tab="profil"><span aria-hidden="true">☺</span>Profil</a>
  </nav>
  <div id="sheet" class="sheet" hidden></div>
  <div id="toast" class="toast" role="status" hidden></div>
  <script src="/vendor/leaflet/leaflet.js"></script>
  <script type="module" src="/app.js"></script>
</body>
</html>
